[project]
name = "g7-openarm-utils"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "g7-openarm-idl",
    "numpy",
]

[project.optional-dependencies]
mujoco = ["mujoco>=3.10.0"]

[tool.uv.sources]
g7-openarm-idl = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/g7_openarm_utils"]
