[project]
name = "g7-openarm-hommi"
version = "0.1.0"
description = "HoMMI policy deployment node for G7 OpenArm"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "g7-openarm-config",
    "g7-openarm-idl",
    "g7-openarm-pinnzoo",
    "g7-openarm-utils",
    "hommi-train",
    "unitree-sdk2py",
]

[tool.uv.sources]
g7-openarm-config = { workspace = true }
g7-openarm-idl = { workspace = true }
g7-openarm-pinnzoo = { workspace = true }
g7-openarm-utils = { workspace = true }
unitree-sdk2py = { path = "../../third_party/unitree_sdk2_python", editable = true }

[project.scripts]
g7-hommi = "g7_openarm_hommi.hommi_node:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/g7_openarm_hommi"]
